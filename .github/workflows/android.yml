name: build

# Builds the debug APK the same way a local checkout does: the two native
# libraries are compiled from the submodule checkouts, and :androidserver runs
# first so packageAndroidServerJar can drop android_server.jar into res/raw.
# The steps that matter live in .github/actions, shared with release.yml, so a
# tag cannot drift away from what this workflow already proved.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assembleDebug:
    # Pinned rather than ubuntu-latest: the latest label is moving to Ubuntu 26,
    # and the Android SDK layout these steps assume is the one on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Prepare the build environment
        uses: ./.github/actions/android-env

      - name: Build the debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 \
            | tee "$RUNNER_TEMP/build.log"

      - name: Report the build failure
        if: failure()
        uses: ./.github/actions/report-build-failure
        with:
          log: ${{ runner.temp }}/build.log

      - name: Check what the APK carries
        uses: ./.github/actions/check-apk
        with:
          apk-dir: app/build/outputs/apk/debug

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
