name: build

# Builds the debug APK the same way a local checkout does: the two native
# libraries are compiled from the submodule checkouts, and :androidserver runs
# first so packageAndroidServerJar can drop android_server.jar into res/raw.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assembleDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        # The submodules are fetched explicitly below: moonlight-common-c needs
        # its own enet/nanors, while libvncserver's noVNC and doxygen submodules
        # are not part of an Android build and are left alone.
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize the submodules the build actually reads
        run: |
          git submodule update --init extern/libvncserver
          git submodule update --init --recursive app/src/main/cpp/moonlight-core/moonlight-common-c
          test -f app/src/main/cpp/moonlight-core/moonlight-common-c/src/Limelight.h
          test -f extern/libvncserver/src/libvncclient/rfbclient.c

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK, CMake and platform this project pins
        # build-tools is left to AGP, which picks and downloads the revision it
        # wants; the NDK and CMake versions are pinned by the build files, so
        # those have to be present under exactly these names.
        run: |
          sdkmanager --install "platforms;android-37" \
            "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Build the debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check what the APK carries
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86_64)/' \
            | grep -E 'libmoonlight-core|libnative-vnc'
          unzip -l "$apk" | grep -E 'res/raw|android_server'
          unzip -l "$apk" | grep -c 'AndroidManifest.xml'

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
