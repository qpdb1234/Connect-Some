name: check-apk
description: >
  Assert that the built debug APK carries every ABI's native libraries and the
  android_server.jar helper, and publish what was found as annotations.

inputs:
  apk-dir:
    description: Directory holding the APK produced by :app:assembleDebug
    required: true

outputs:
  apk:
    description: Path of the APK that was checked
    value: ${{ steps.inspect.outputs.apk }}

runs:
  using: composite
  steps:
    - name: Check what the APK carries
      id: inspect
      shell: bash
      # Asserted per ABI: a single grep over the whole listing would still pass
      # if one of the three ABIs quietly disappeared from the build.
      run: |
        apk=$(find "${{ inputs.apk-dir }}" -name '*.apk' | head -n 1)
        test -n "$apk"
        echo "apk=$apk" >> "$GITHUB_OUTPUT"
        echo "::notice::apk $(basename "$apk") $(stat -c%s "$apk") B, $(unzip -Z1 "$apk" | wc -l) entries"
        for abi in armeabi-v7a arm64-v8a x86_64; do
          lib=$(unzip -l "$apk" | awk -v a="lib/$abi/" 'index($4, a) == 1 { n++; s += $1 } END { print n " " s + 0 }')
          echo "::notice::lib/$abi -> $lib (entries bytes)"
          set -- $lib
          if [ "$1" -lt 5 ]; then
            echo "::error::lib/$abi carries only $1 libraries"
            exit 1
          fi
          for so in libmoonlight-core.so libnative-vnc.so; do
            if ! unzip -l "$apk" | grep -q "lib/$abi/$so"; then
              echo "::error::lib/$abi/$so is missing"
              exit 1
            fi
          done
        done
        if ! unzip -l "$apk" | grep -q 'res/raw/android_server.jar'; then
          echo '::error::res/raw/android_server.jar is missing, the ADB helper was not bundled'
          exit 1
        fi
