name: report-build-failure
description: >
  Turn the lines of the gradle log that name the failing task into check-run
  annotations. Downloading the job log needs authentication, annotations do not,
  so this is how a failure is read from outside the runner.

inputs:
  log:
    description: Path of the log the build step wrote
    required: true

runs:
  using: composite
  steps:
    - name: Report the build failure
      shell: bash
      run: |
        log='${{ inputs.log }}'
        if [ ! -f "$log" ]; then
          echo '::error::the gradle log is missing, gradle did not get to run'
          exit 0
        fi
        grep -E "FAILED|^\* What went wrong|^Caused by:|e: |error:|Execution failed" \
          "$log" | tail -n 10 > "$log.picked" || true
        if [ ! -s "$log.picked" ]; then
          tail -n 10 "$log" > "$log.picked"
        fi
        # Annotations cannot span lines, so each line is flattened on its own.
        while IFS= read -r line; do
          msg=$(printf '%s' "$line" | tr -d '\r' | cut -c1-180 | sed 's/%/%25/g')
          if [ -n "$msg" ]; then
            echo "::error::$msg"
          fi
        done < "$log.picked"
